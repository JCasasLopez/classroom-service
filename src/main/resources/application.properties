# General
spring.application.name=classroom-service
server.port=8500
server.servlet.context-path=/classroom
logging.level.org.springframework.security=INFO
spring.jackson.deserialization.adjust-dates-to-context-time-zone=true
# spring.profiles.active=dev

# Environment variables (topics are shared among different micro-services)
jwt.secretKey=${JWT_SECRETKEY}
frontend.url=${FRONTEND_URL}

# Database-ralated
spring.jpa.hibernate.naming.implicit-strategy=org.hibernate.boot.model.naming.ImplicitNamingStrategyLegacyJpaImpl
spring.jpa.hibernate.naming.physical-strategy=org.hibernate.boot.model.naming.PhysicalNamingStrategyStandardImpl
spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=false
spring.datasource.url=jdbc:mysql://localhost:3306/classrooms
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.datasource.username=${DB_ROOT_USERNAME}
spring.datasource.password=${DB_ROOT_PASSWORD}
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect

# Kafka-related
spring.kafka.producer.topic-name=${KAFKA_TOPIC_CLASSROOMS}
spring.kafka.producer.topic-number-replicas=${KAFKA_NUMBER_REPLICAS}
spring.kafka.producer.topic-number-in-sync-replicas=${KAFKA_NUMBER_IN_SYNC_REPLICAS}
spring.kafka.admin.auto-create=false

spring.kafka.bootstrap-servers=127.0.0.1:9092
spring.kafka.producer.properties.spring.json.add.type.headers=false
spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=org.springframework.kafka.support.serializer.JsonSerializer
spring.kafka.producer.acks=all
spring.kafka.producer.properties.enable.idempotence=true
spring.kafka.producer.retries=2147483647
spring.kafka.producer.properties.max.in.flight.requests.per.connection=5